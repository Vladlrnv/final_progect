{% extends 'base.html' %}

{% load my_tags %}
{% block title %}Профиль{% endblock %}

{% block content %}

<section class="section" id="auth">
    <h2 class="text-center mb-4">Редактирование профиля</h2>
    <form class="feedback-form" action="#" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="text-center">
            <button type="submit" class="btn btn-custom">Сохранить</button>
        </div>
    </form>
</section>
{% endblock %}
