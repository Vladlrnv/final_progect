<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Медицинская клиника</title>

  <!-- Подключение Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Подключение шрифта -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* Общие стили */
    body {
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      font-family: 'Orbitron', sans-serif;
      color: #ffffff;
    }

    /* Заголовки */
    h1, h2 {
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
    }

    /* Навигация */
    .navbar {
      background-color: rgba(0, 0, 0, 0.8);
      border-bottom: 2px solid #00ffff;
    }

    /* Акценты */
    .neon-text {
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
    }

    /* Карточки услуг */
    .service-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #00ffff;
      border-radius: 15px;
      padding: 20px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .service-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #00ffff;
    }

    /* Контактная информация */
    .contact-info {
      font-size: 1.2rem;
    }

    /* Форма обратной связи */
    .feedback-form {
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 15px;
      border: 1px solid #00ffff;
    }

    /* Кнопки */
    .btn-custom {
      background-color: #00ffff;
      color: #000;
      border: none;
      box-shadow: 0 0 10px #00ffff;
      transition: all 0.3s;
    }

    .btn-custom:hover {
      background-color: #00cccc;
      box-shadow: 0 0 20px #00ffff;
    }
  </style>
</head>
<body>

  <!-- Навигационная панель -->
  <nav class="navbar navbar-expand-lg mb-4">
    <div class="container-fluid justify-content-center">
      <a class="navbar-brand neon-text" href="/">Главная</a>
      <a class="navbar-brand neon-text" href="/company">О компании</a>
      <a class="navbar-brand neon-text" href="/contacts">Контакты</a>
      {% if user.is_authenticated %}
      <a class="navbar-brand neon-text" href="/profile">Личный кабинет</a>
      <form method="post" action="{% url 'users:logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-custom">Выйти</button>
      </form>
      {% else %}
      <a class="navbar-brand neon-text" href="/login">Войти</a>
      <a class="navbar-brand neon-text" href="/register">Зарегистрироваться</a>
      {% endif %}
    </div>
  </nav>

  <!-- Главный блок -->
  <div class="container">
  {% block content %}{% endblock %}
  </div>

  <!-- Подключение Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
